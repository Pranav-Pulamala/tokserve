[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tokserve"
version = "0.1.0"
description = "An educational from-scratch LLM inference engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "numpy>=2.1,<2.4",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "torch>=2.6,<3",
    "transformers>=4.46,<5",
]

[tool.setuptools.packages.find]
include = ["tokserve*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true


[[tool.mypy.overrides]]
module = [
    "transformers",
    "transformers.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: tests that exercise interactions between components",
    "gpu: tests that require a compatible GPU environment",
]

[[tool.mypy.overrides]]
module = ["triton", "triton.*"]
ignore_missing_imports = true